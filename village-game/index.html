<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aldea Game</title>
  </head>
  <body>
    <div id="app">
      <div id="ui">
        <div id="resources">
          <span>Oro: <span id="gold">0</span></span>
          <span>Comida: <span id="food">0</span></span>
          <span>Población: <span id="population">0</span></span>
        </div>
        <div id="controls">
          <button id="btn-house" class="build-btn" data-type="house">Casa (50 Oro)</button>
          <button id="btn-farm" class="build-btn" data-type="farm">Granja (30 Oro)</button>
          <button id="btn-mine" class="build-btn" data-type="mine">Mina (100 Oro)</button>
        </div>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
